x-node: &node
  image: ghcr.io/logos-blockchain/logos-blockchain-node:${NODE_IMAGE_LABEL}
  volumes:
    - blend-data:/node-data
    - ./deployment:/etc/logos-blockchain
  entrypoint: /etc/logos-blockchain/scripts/blend/run_node.sh

x-env: &env
  LOG_LEVEL: DEBUG
  LOG_APPENDER: rolling-max-files
  LOG_APPENDER_MAX_FILES: 48

services:

  blend-node-0:
    <<: *node
    container_name: blend-node-0
    environment:
      <<: *env
      LB_HOST_IDX: 0
      CFG_NETWORK_PORT: 3000
      CFG_BLEND_PORT: 3400
      CFG_API_PORT: 18080
      STATE_PATH: /node-data/0/state
    ports:
      - "3000:3000/udp"
      - "3400:3400/udp"
      - "127.0.0.1:18080:18080/tcp"

  blend-node-1:
    <<: *node
