[package]
categories  = { workspace = true }
description = "Logos SQL integration tests and settlement benchmark"
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "logos-blockchain-sql-tests"
publish     = false
repository  = { workspace = true }
version     = { workspace = true }

[lints]
workspace = true

[dependencies]
cucumber                    = { features = ["macros", "output-junit"], workspace = true }
futures                     = { workspace = true }
hex                         = { workspace = true }
lb-common-http-client       = { workspace = true }
lb-core                     = { workspace = true }
lb-groth16                  = { workspace = true }
lb-testing-framework        = { workspace = true }
lb-zone-sdk                 = { workspace = true }
logos-blockchain-tests      = { workspace = true }
logos-blockchain-zone-tests = { workspace = true }
logos-sql                   = { workspace = true }
rand                        = { workspace = true }
rusqlite                    = { workspace = true }
serde                       = { features = ["derive"], workspace = true }
serde_json                  = { workspace = true }
thiserror                   = { workspace = true }
tokio                       = { workspace = true }
tracing                     = { workspace = true }

[features]
cucumber = []

[[test]]
harness           = false
name              = "cucumber"
path              = "tests/cucumber.rs"
required-features = ["cucumber"]
